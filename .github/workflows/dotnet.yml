name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x   

    - name: Restore dependencies
      run: dotnet restore    RockEngine/RockEngine.sln    # restores the solution in the current directory

    - name: Build
      run: dotnet build RockEngine/RockEngine.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test RockEngine/RockEngine.sln --no-build --configuration Release --verbosity normal
